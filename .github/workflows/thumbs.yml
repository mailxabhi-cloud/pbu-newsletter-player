name: Fetch film thumbnails
# Downloads the YouTube thumbnails for the newsletter's films so they can be built into the newsletter file.
on:
  push:
    paths: ['.github/workflows/thumbs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download thumbnails
        run: |
          mkdir -p thumbs
          for id in Xh3gmNR0YUk 0FNae22F5ek zDwxc6W4A1M aOJob_aEJZA; do
            for q in maxresdefault sddefault hqdefault; do
              if curl -fsSL -o "thumbs/$id.jpg" "https://i.ytimg.com/vi/$id/$q.jpg"; then echo "$id $q"; break; fi
            done
          done
          # alternative frames (YouTube's automatic stills at about 25%, 50% and 75% of the film)
          mkdir -p thumbs/alt
          for id in Xh3gmNR0YUk; do
            for n in 1 2 3; do
              for q in maxres sd hq; do
                if curl -fsSL -o "thumbs/alt/${id}_${n}.jpg" "https://i.ytimg.com/vi/$id/${q}${n}.jpg"; then echo "$id frame $n: $q"; break; fi
              done
            done
          done
          ls -lR thumbs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add thumbs
          git diff --cached --quiet || (git commit -m "Add film thumbnails" && git push)
