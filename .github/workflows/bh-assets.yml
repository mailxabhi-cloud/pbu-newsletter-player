name: Fetch Brand Highlights assets
# Downloads official model photos and brand logos for the newsletter's Brand Highlights page.
on:
  push:
    paths: ['.github/workflows/bh-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set +e
          mkdir -p assets/poll assets/logos
          get(){ curl -fsSL -o "$1" "$2" && echo "ok  $1 ($(stat -c%s "$1") bytes)" || echo "FAIL $1 <- $2"; }
          # brand logos from Wikimedia Commons (search the File namespace, keep the top results)
          commons(){ # $1 = name prefix, $2 = search text
            curl -fsSL "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&format=json&gsrsearch=$2" \
              | jq -r '.query.pages[] | "\(.index)\t\(.title)\t\(.imageinfo[0].url)"' | sort -n | head -8 | while IFS=$'\t' read -r i t u; do
                ext="${u##*.}"; ext="${ext%%\?*}"; echo "$1 #$i $t"; get "assets/logos/${1}_$i.$ext" "$u"; done; }
          commons alfalogo "Alfa%20Romeo%20logo"
          commons fiatlogo "Fiat%20logo"
          ls -lR assets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Add brand logo candidates" && git push)
